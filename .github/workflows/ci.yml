name: Verify pack
on: [push, pull_request]

jobs:
  verify:
    name: Verify texture references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify-pack
        shell: bash
        run: tools/verify/pack.sh

  glyphs:
    name: Verify fonts load in game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Run verify-glyphs
        run: python3 tools/verify/glyphs.py
