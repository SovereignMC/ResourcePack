name: Optimize resource pack
permissions: write-all
# Only branch pushes: a pushed release tag would rebuild that tag's old tree and
# publish it as the newest "latest" release, which the proxy serves to players.
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'format_*/**'
      - 'bbmodels/**'
      - 'pack.mcmeta'
      - 'tools/generate/bettermodel/generate.sh'
  # wiki-art.yml pushes with GITHUB_TOKEN, which does not fire the push trigger above.
  workflow_dispatch:
# One release at a time, in push order, so "latest" is always the newest commit.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  packsquash:
    name: Optimize resource pack
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # A non-shallow repository clone is required

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Runs the real BetterModel jar inside a throwaway Paper server. BetterModel
      # writes its generated resource pack for every model in bbmodels/, and the
      # script merges that pack's namespace into assets/ before PackSquash runs.
      - name: Generate BetterModel assets
        shell: bash
        env:
          BETTERMODEL_VERSION: '3.7.0'
          PAPER_VERSION: '26.3'
        run: tools/generate/bettermodel/generate.sh

      - name: Verify texture references
        shell: bash
        run: tools/verify/pack.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every font must load in the 1.21.8 and 1.21.11 clients; one bad provider makes
      # the client drop the whole font file and every glyph in it renders as a box.
      - name: Verify fonts load in game (source)
        run: |
          pip install --quiet pillow
          python3 tools/verify/glyphs.py

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = '.'
            output_file_path = '/tmp/pack.zip'

            # Gun viewmodel data textures: every pixel is shader data (header, vertices,
            # bone matrices), read with texelFetch. Palette quantization or alpha
            # "optimizations" scramble it and the gun disappears in first person.
            ['assets/weapons/textures/item/objmc/*.png']
            color_quantization_target = 'none'
            skip_alpha_optimizations = true

            # PlaneChase head canvas palette: header, shape table and element rows are shader
            # data read with texelFetch (tools/generate/canvas). Keep every texel exact.
            ['assets/planechase/textures/block/canvas_palette.png']
            color_quantization_target = 'none'
            skip_alpha_optimizations = true

            # /ts style preview tiles: each tile's last column holds a near-transparent
            # texel that pins the glyph advance. Quantization drops it, the line gets
            # narrower and the client re-centres it (rows of the montage slide sideways).
            ['assets/sovereignmc/textures/font/structure_preview/*.png']
            color_quantization_target = 'none'
            skip_alpha_optimizations = true

            # Tablist header art: split glyphs are joined by pinning an alpha-1 texel in the
            # left cell's last column (it sets the advance), and the wordmark is 2x art that
            # quantization visibly bands. Keep them lossless.
            ['assets/sovereignmc/textures/font/tab/*.png']
            color_quantization_target = 'none'
            skip_alpha_optimizations = true

            # Version overlays (pack.mcmeta "overlays"): PackSquash only knows the root
            # assets/ tree and silently drops overlay directories, which shipped the
            # 1.21.9+ menu blur to 1.21.7-1.21.8. Copy every overlay file as-is.
            ['format_*/**']
            force_include = true

      # Again on the zip players download: PackSquash rewrites JSON and PNGs.
      - name: Verify fonts load in game (built zip)
        run: python3 tools/verify/glyphs.py --zip /tmp/pack.zip

      - run: "sha1sum /tmp/pack.zip | awk '{ print $1 }' | tr -d \"\n\" > /tmp/hash.txt" # Generate Pack Hash
      
      - name: Stage wiki index
        run: |
          if [ -f assets/sovereignwiki/index.json ]; then
            cp assets/sovereignwiki/index.json /tmp/wiki-index.json
          fi

      - name: Tag and create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ResourcePack-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            /tmp/pack.zip
            /tmp/hash.txt
            /tmp/wiki-index.json
          fail_on_unmatched_files: false
